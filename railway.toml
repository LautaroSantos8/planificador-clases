[build]
builder = "nixpacks"

[deploy]
startCommand = "cd backend && python manage.py migrate --no-input && python manage.py collectstatic --no-input && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 120"healthcheckPath = "/api/ai/health/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
